<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: 'Plus Jakarta Sans', Helvetica, sans-serif; color: oklch(0.26 0.07 265);">
  <section style="padding: 58px 32px 40px; border-bottom: 1px solid oklch(0.91 0.012 255); display: flex; flex-direction: column; gap: 14px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.58 0.14 195);">{{ eyebrow }}</span>
    <h1 style="margin: 0; max-width: 26ch; font-size: 42px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.06; text-wrap: balance;">{{ title }}</h1>
    <p style="margin: 0; max-width: 66ch; font-size: 16px; line-height: 1.6; color: oklch(0.44 0.045 265); text-wrap: pretty;">{{ lede }}</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px;">
      <sc-for list="{{ meta }}" as="m" hint-placeholder-count="3">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: oklch(0.42 0.05 265); border: 1px solid oklch(0.91 0.012 255); background: oklch(1 0 0); border-radius: 7px; padding: 5px 10px;">{{ m }}</span>
      </sc-for>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 266px 1fr; align-items: start;">
    <nav style="position: sticky; top: 78px; padding: 34px 24px 40px 32px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid oklch(0.91 0.012 255);">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.64 0.04 265); padding: 0 8px 10px;">Sommaire</span>
      <sc-for list="{{ toc }}" as="t" hint-placeholder-count="8">
        <a href="{{ t.href }}" style="display: flex; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13px; line-height: 1.4; color: oklch(0.42 0.05 265);" style-hover="background: oklch(0.965 0.006 250); color: oklch(0.24 0.08 265);">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: oklch(0.68 0.04 265); flex: none;">{{ t.n }}</span>
          {{ t.label }}
        </a>
      </sc-for>
    </nav>

    <div style="padding: 34px 32px 60px 44px; max-width: 860px; display: flex; flex-direction: column; gap: 34px;">
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="8">
        <div id="{{ s.id }}" style="display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 96px;">
          <div style="display: flex; align-items: baseline; gap: 12px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: oklch(0.62 0.11 195);">{{ s.n }}</span>
            <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.028em;">{{ s.h }}</h2>
          </div>
          <sc-for list="{{ s.ps }}" as="p" hint-placeholder-count="2">
            <p style="margin: 0; font-size: 14.5px; line-height: 1.68; color: oklch(0.36 0.05 265); text-wrap: pretty;">{{ p }}</p>
          </sc-for>
          <sc-if value="{{ s.hasRows }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 1px; background: oklch(0.92 0.012 255); border: 1px solid oklch(0.92 0.012 255); border-radius: 12px; overflow: hidden; margin-top: 4px;">
              <sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="3">
                <div style="display: flex; gap: 16px; padding: 12px 16px; background: oklch(1 0 0); align-items: baseline;">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.55 0.045 265); width: 176px; flex: none;">{{ r.k }}</span>
                  <span style="font-size: 13.5px; line-height: 1.55; color: oklch(0.3 0.06 265); text-wrap: pretty;">{{ r.v }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ s.hasList }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 2px;">
              <sc-for list="{{ s.list }}" as="i" hint-placeholder-count="3">
                <div style="display: flex; gap: 11px; font-size: 14px; line-height: 1.6; color: oklch(0.36 0.05 265);">
                  <span style="color: oklch(0.68 0.18 38); font-weight: 700; flex: none;">—</span>
                  <span style="text-wrap: pretty;">{{ i }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>

      <div style="margin-top: 6px; padding: 20px 22px; border-radius: 13px; background: oklch(0.975 0.005 250); border: 1px solid oklch(0.92 0.012 255); display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
        <span style="font-size: 14px; line-height: 1.5; color: oklch(0.4 0.05 265); max-width: 52ch; text-wrap: pretty;">Une question sur ce document, ou une demande concernant vos données&nbsp;? Écrivez-nous, nous répondons sous 72 heures ouvrées.</span>
        <a href="Contact.dc.html" style="margin-left: auto; padding: 11px 18px; border-radius: 10px; background: oklch(0.24 0.075 265); color: oklch(0.97 0.01 250); font-size: 13.5px; font-weight: 700; text-decoration: none;">Nous contacter</a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Document légal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lede&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;sections&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{h: string, ps?: string[], rows?: {k: string, v: string}[], list?: string[]}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const raw = this.props.sections ?? [];
    const num = (i) => String(i + 1).padStart(2, '0');
    const sections = raw.map((s, i) => ({
      id: 's' + (i + 1), n: num(i), h: s.h,
      ps: s.ps ?? [],
      rows: s.rows ?? [], hasRows: !!(s.rows && s.rows.length),
      list: s.list ?? [], hasList: !!(s.list && s.list.length)
    }));
    return {
      eyebrow: this.props.eyebrow ?? 'Document légal',
      title: this.props.title ?? '',
      lede: this.props.lede ?? '',
      meta: this.props.meta ?? [],
      sections,
      toc: sections.map(s => ({ n: s.n, label: s.h, href: '#' + s.id }))
    };
  }
}
</script>
</body>
</html>
